# Rebuild the user manual whenever what it is built FROM changes.
#
# The manual has two sources — the prose in USER_GUIDE/*.md, and the images the
# prose embeds (screenshots dispatched from aevum-web, banners pushed by
# aevum-brand). Either drifting makes the built PDF wrong, and wrong in the
# quietest possible way: it still opens, still looks finished, and simply shows
# the reader something the product no longer does.
#
# This is the downstream half of the screenshot pipeline. aevum-web captures and
# opens a PR here; merging that PR lands new images on main, which lands here, and
# the manual is rebuilt from them. Without this step the PDF would silently lag
# its own inputs — the same failure the brand CDN has, where a broken email logo
# is never reported because mail clients do not report broken images.
#
# The trigger is an INPUT HASH, never the PDF's own bytes. The PDF carries a build
# timestamp and puppeteer embeds a creation date, so its bytes change on every
# build; comparing them would make this rebuild forever. tooling/manual-inputs.mjs
# hashes the inputs and USER_GUIDE/.manual-inputs.sha256 records what the
# committed PDF was built from.
#
# The PDF is committed rather than published as a release asset, because it is the
# artifact people are meant to be able to open from the repo, and because the
# eventual dispatch to aevum-marketing then reads a path rather than a release
# API. The cost is ~2 MB of binary per regeneration. If that churn ever becomes a
# problem, switching to a release asset changes only the last step here — the hash
# gate, which is the part that matters, stays as it is.

name: manual

on:
  push:
    branches: [main]
    paths:
      - 'USER_GUIDE/**'
      - 'tooling/build-manual.mjs'
      - 'tooling/manual-inputs.mjs'
      - 'tooling/theme.css'
  workflow_dispatch:

concurrency:
  group: manual
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    name: rebuild the PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - run: npm ci
        working-directory: tooling

      # Non-zero means the docs or images moved since the committed PDF was
      # built. That is the whole trigger; nothing else needs to be inspected.
      - name: is the PDF stale?
        id: drift
        working-directory: tooling
        run: |
          if npm run --silent manual:check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Mermaid diagrams are rendered to static SVG in a headless browser and
      # mermaid loads from a CDN, so this step needs network access at build time.
      - name: rebuild
        if: steps.drift.outputs.stale == 'true'
        working-directory: tooling
        run: npm run manual

      - name: commit
        if: steps.drift.outputs.stale == 'true'
        run: |
          set -euo pipefail
          git config user.name  "Rohit Solanki"
          git config user.email "176801048+RohitSSolanki@users.noreply.github.com"
          git add USER_GUIDE/user_manual.pdf USER_GUIDE/.manual-inputs.sha256
          if git diff --cached --quiet; then
            echo "manual: inputs moved but the build produced nothing new"
            exit 0
          fi
          git commit -F - <<EOF
          docs(manual): rebuild user_manual.pdf from the current docs and images

          Automated by .github/workflows/manual.yml — the manual's inputs changed,
          so the artifact was stale. Do not hand-edit the PDF: it is output, and
          the next input change overwrites it.
          EOF
          # A push authenticated with GITHUB_TOKEN does not trigger workflows, so
          # this cannot re-trigger itself. That is load-bearing here, not
          # incidental: the rebuild always changes the PDF's bytes.
          git push
