# Product-feature registry — the editorial source of truth for the T0 doc merge.
#
# The ONE thing no generator can derive: how the code lanes' per-MODULE docs group
# into the product's TOPIC axis. A product topic ("Savings account") often spans
# several modules (bank_accounts + treasury), and modules split across lanes for
# implementation reasons (backend `users` + frontend `account`) belong to one topic
# ("Account & security"). This file declares that grouping; feature-index.mjs reads
# it alongside each lane's own module manifest and ASSERTS coverage — every
# user_facing module in either lane must be claimed by some topic here, and every
# module a topic references must exist and be user_facing. A drift on either side
# fails the build (the same coverage discipline the lane manifests use for T3).
#
# Each topic drives one docs/public/<key>.md merged product page, which in turn
# feeds the USER_GUIDE. `backend` / `frontend` list the lane MODULE names (as keyed
# in that lane's modules.manifest); their titles + one-line scopes are pulled from
# the manifests at merge time, so they are not repeated here. `blurb` is the topic's
# product-voice one-liner.

[topics.getting-started]
title    = "Getting started"
blurb    = "Create your account, add your first transaction, and find your way around."
backend  = ["onboarding"]
frontend = ["onboarding", "dashboard"]

[topics.consumption-tax]
title    = "The consumption tax & your weekly bill"
blurb    = "The self-imposed tax at the heart of Aevum, and the single weekly bill it rolls up to."
backend  = ["taxation"]
frontend = ["taxation"]

